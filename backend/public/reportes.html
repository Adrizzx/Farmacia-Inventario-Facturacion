<!-- reportes.html - Visualización de reportes y exportación -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #e0f7fa 0%, #b2f0e6 50%, #e3f0ff 100%);">
  <div id="navbar"></div>
  <div class="container-fluid flex-grow-1">
    <div class="row">
      <div id="sidebar"></div>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-4">
        <div class="card shadow-lg border-0 rounded-4 mb-4 bg-white bg-opacity-90">
          <div class="card-body py-4 px-5 d-flex align-items-center gap-3">
            <h2 class="fw-bold mb-0 text-info"><i class="bi bi-bar-chart"></i> Reportes</h2>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-4">
            <button class="btn btn-outline-primary w-100 mb-2 rounded-pill d-flex align-items-center justify-content-center gap-2" id="btnReporteInventario"><i class="bi bi-archive"></i> Inventario</button>
          </div>
          <div class="col-md-4">
            <button class="btn btn-outline-success w-100 mb-2 rounded-pill d-flex align-items-center justify-content-center gap-2" id="btnReporteVentas"><i class="bi bi-cash-coin"></i> Ventas</button>
          </div>
          <div class="col-md-4">
            <button class="btn btn-outline-info w-100 mb-2 rounded-pill d-flex align-items-center justify-content-center gap-2" id="btnReporteFinanciero"><i class="bi bi-graph-up"></i> Financiero</button>
          </div>
        </div>
        <div id="panelReportes">
          <!-- Aquí se mostrarán los reportes y gráficos -->
        </div>
      </main>
    </div>
  </div>
  <footer class="text-center py-3 mt-auto" style="background:rgba(255,255,255,0.7); font-size:0.95rem;">
    <span class="text-secondary">&copy; 2025 Farmacia Web. Desarrollado por <a href="#" class="text-primary text-decoration-none">Tu Equipo</a></span>
  </footer>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/sidebar.js"></script>
</body>
</html>
