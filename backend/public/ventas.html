<!-- ventas.html - Registro de ventas y facturación -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas | Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #e0f7fa 0%, #b2f0e6 50%, #e3f0ff 100%);">
  <div id="navbar"></div>
  <div class="container-fluid flex-grow-1">
    <div class="row">
      <div id="sidebar"></div>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-4">
        <div class="card shadow-lg border-0 rounded-4 mb-4 bg-white bg-opacity-90">
          <div class="card-body py-4 px-5 d-flex justify-content-between align-items-center">
            <h2 class="fw-bold mb-0 text-success"><i class="bi bi-receipt"></i> Registrar venta</h2>
          </div>
        </div>
        <div class="card shadow border-0 rounded-4 bg-white bg-opacity-95 mb-4">
          <div class="card-body">
            <form id="formVenta" class="row g-3 mb-4" novalidate>
              <div class="col-md-4">
                <label class="form-label">Nombre cliente</label>
                <input type="text" class="form-control rounded-pill" name="cliente_nombre" required>
                <div class="invalid-feedback">Campo requerido.</div>
              </div>
              <div class="col-md-4">
                <label class="form-label">Cédula</label>
                <input type="text" class="form-control rounded-pill" name="cliente_cedula" required pattern="[0-9]{10,13}">
                <div class="invalid-feedback">Ingrese cédula válida.</div>
              </div>
              <div class="col-md-4">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control rounded-pill" name="fecha" required>
                <div class="invalid-feedback">Campo requerido.</div>
              </div>
              <div class="col-12">
                <label class="form-label">Medicamentos</label>
                <div id="medicamentosVenta">
                  <!-- JS agregará campos dinámicamente -->
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm mt-2 rounded-pill" id="agregarMedicamento"><i class="bi bi-plus-circle"></i> Agregar medicamento</button>
              </div>
              <div class="col-12">
                <label class="form-label">Total</label>
                <input type="text" class="form-control rounded-pill" name="total" id="totalVenta" readonly>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-success btn-lg rounded-pill"><i class="bi bi-cash-coin"></i> Registrar venta</button>
              </div>
            </form>
            <div id="facturaImprimible" class="d-none">
              <!-- Aquí se generará la factura legal para imprimir -->
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <footer class="text-center py-3 mt-auto" style="background:rgba(255,255,255,0.7); font-size:0.95rem;">
    <span class="text-secondary">&copy; 2025 Farmacia Web. Desarrollado por <a href="#" class="text-primary text-decoration-none">Tu Equipo</a></span>
  </footer>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/ventas.js"></script>
  <script src="js/sidebar.js"></script>
</body>
</html>
