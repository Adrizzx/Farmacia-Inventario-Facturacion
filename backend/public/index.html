<!-- index.html - Menú principal del sistema de farmacia (demo) -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmacia | Menú principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #e0f7fa 0%, #b2f0e6 50%, #e3f0ff 100%);">
  <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row justify-content-center w-100">
      <div class="col-lg-8 col-xl-7">
        <div class="card shadow-lg border-0 bg-white bg-opacity-90 rounded-4 p-0 overflow-hidden animate__animated animate__fadeInDown">
          <div class="card-body text-center p-5">
            <img src="img/pharmacy.svg" alt="Farmacia" style="width:90px; margin-bottom:1rem; filter: drop-shadow(0 0 16px #00c9a7aa); background:white; border-radius:50%; padding:10px;">
            <h1 class="mb-3 fw-bold text-primary" style="font-size:2.2rem;">Sistema de Farmacia</h1>
            <p class="lead mb-4 text-secondary">Bienvenido. Selecciona una opción para comenzar:</p>
            <div class="d-grid gap-3 col-8 mx-auto mt-4">
              <a href="login.html" class="btn btn-primary btn-lg d-flex align-items-center justify-content-center gap-2"><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</a>
              <a href="dashboard.html" class="btn btn-outline-success d-flex align-items-center justify-content-center gap-2"><i class="bi bi-speedometer2"></i> Dashboard (demo)</a>
              <a href="medicamentos.html" class="btn btn-outline-info d-flex align-items-center justify-content-center gap-2"><i class="bi bi-capsule"></i> Gestión de Medicamentos</a>
              <a href="ventas.html" class="btn btn-outline-warning d-flex align-items-center justify-content-center gap-2"><i class="bi bi-receipt"></i> Registrar Venta</a>
              <a href="reportes.html" class="btn btn-outline-dark d-flex align-items-center justify-content-center gap-2"><i class="bi bi-bar-chart"></i> Reportes</a>
            </div>
            <hr class="my-4">
            <p class="text-muted">Modo demo: no requiere backend. Usuario demo: <b>admin</b> / <b>admin</b></p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="text-center py-3 mt-auto" style="background:rgba(255,255,255,0.7); font-size:0.95rem;">
    <span class="text-secondary">&copy; 2025 Farmacia Web. Desarrollado por <a href="#" class="text-primary text-decoration-none">Tu Equipo</a></span>
  </footer>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
