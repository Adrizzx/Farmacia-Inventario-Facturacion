<!-- register.html - Registro de nuevo usuario -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse | Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #e0f7fa 0%, #b2f0e6 50%, #e3f0ff 100%);">
  <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row justify-content-center w-100">
      <div class="col-lg-6 col-xl-5">
        <div class="card shadow-lg border-0 bg-white bg-opacity-90 rounded-4 p-0 overflow-hidden animate__animated animate__fadeInDown">
          <div class="card-body p-5">
            <h2 class="text-center mb-4 fw-bold text-success"><i class="bi bi-person-plus"></i> Crear cuenta</h2>
            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label for="regUser" class="form-label">Usuario</label>
                <input type="text" class="form-control rounded-pill" id="regUser" name="regUser" required>
                <div class="invalid-feedback">Ingrese un usuario.</div>
              </div>
              <div class="mb-3">
                <label for="regPass" class="form-label">Contraseña</label>
                <input type="password" class="form-control rounded-pill" id="regPass" name="regPass" required>
                <div class="invalid-feedback">Ingrese una contraseña.</div>
              </div>
              <div class="mb-3">
                <label for="regPass2" class="form-label">Repetir contraseña</label>
                <input type="password" class="form-control rounded-pill" id="regPass2" name="regPass2" required>
                <div class="invalid-feedback">Repita la contraseña.</div>
              </div>
              <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
              <div id="registerSuccess" class="alert alert-success d-none" role="alert"></div>
              <button type="submit" class="btn btn-success w-100 btn-lg rounded-pill"><i class="bi bi-person-check"></i> Registrarse</button>
              <div class="mt-3 text-center">
                <a href="login.html" class="link-primary text-decoration-none"><i class="bi bi-box-arrow-in-right"></i> ¿Ya tienes cuenta? Inicia sesión</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="text-center py-3 mt-auto" style="background:rgba(255,255,255,0.7); font-size:0.95rem;">
    <span class="text-secondary">&copy; 2025 Farmacia Web. Desarrollado por <a href="#" class="text-primary text-decoration-none">Tu Equipo</a></span>
  </footer>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
