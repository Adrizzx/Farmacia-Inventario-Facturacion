<!-- dashboard.html - Panel principal tras login -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navbar superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Farmacia</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Perfil</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Cerrar sesión</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container-fluid">
    <div class="row">
      <!-- Menú lateral -->
      <nav class="col-md-2 d-none d-md-block bg-light sidebar">
        <div class="position-sticky pt-3">
          <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="medicamentos.html">Medicamentos</a></li>
            <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
            <li class="nav-item"><a class="nav-link" href="reportes.html">Reportes</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Usuarios</a></li>
          </ul>
        </div>
      </nav>
      <!-- Contenido principal -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-4">
        <h1 class="h2">Bienvenido al sistema de farmacia</h1>
        <div class="row mt-4">
          <div class="col-md-4">
            <div class="card text-bg-warning mb-3">
              <div class="card-body">
                <h5 class="card-title">Medicamentos por vencer</h5>
                <p class="card-text" id="alertasVencimiento">Cargando...</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card text-bg-success mb-3">
              <div class="card-body">
                <h5 class="card-title">Ventas del día</h5>
                <p class="card-text" id="ventasDia">$0.00</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card text-bg-info mb-3">
              <div class="card-body">
                <h5 class="card-title">Inventario total</h5>
                <p class="card-text" id="inventarioTotal">0 productos</p>
              </div>
            </div>
          </div>
        </div>
        <!-- Gráficos -->
        <div class="row mt-4">
          <div class="col-md-6">
            <canvas id="graficoIngresos"></canvas>
          </div>
          <div class="col-md-6">
            <canvas id="graficoMasVendidos"></canvas>
          </div>
        </div>
      </main>
    </div>
  </div>
  <footer class="text-center py-3 mt-auto" style="background:rgba(255,255,255,0.7); font-size:0.95rem;">
    <span class="text-secondary">&copy; 2025 Farmacia Web. Desarrollado por <a href="#" class="text-primary text-decoration-none">Tu Equipo</a></span>
  </footer>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
